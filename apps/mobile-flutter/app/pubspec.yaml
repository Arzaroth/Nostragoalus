name: nostragoalus
description: Nostragoalus native mobile client (Flutter).
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  # API client + bearer auth token storage
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.0
  # state (the TanStack-query-equivalent query layer)
  flutter_riverpod: ^2.6.1
  # realtime: voice signaling + live over the server's _ws.ts hub
  web_socket_channel: ^3.0.1
  # Phase 0 voice probe (+ Phase 4): WebRTC + native call UI/background audio
  flutter_webrtc: ^0.12.5
  flutter_callkit_incoming: ^2.5.2
  # E2EE: libsodium, the same primitives as the web app's libsodium-wrappers-sumo
  # (used by the Phase 0 e2ee probe / Phase 3). ffi to the native lib.
  sodium_libs: ^3.4.4
  share_plus: ^12.0.2
  sodium: ^3.4.6
  crypto: ^3.0.7
  flutter_web_auth_2: ^5.0.3
  flutter_native_splash: ^2.4.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  # The shared locale JSON (shared/i18n-json) mirrored into assets/i18n by
  # tool/sync_i18n.sh (mise run i18n-sync); the single source of truth stays in
  # shared/. mise run i18n-check fails CI if the mirror drifts.
  assets:
    - assets/i18n/
    # Frozen cross-stack KATs (shared/parity-json), mirrored by tool/sync_parity.sh.
    - assets/parity/
    - assets/icon/

# Launch splash (indigo brand background + the app icon). Regenerate:
# dart run flutter_native_splash:create
flutter_native_splash:
  color: "#0D0F1A"
  image: assets/icon/maskable.png
  android_12:
    color: "#0D0F1A"
    image: assets/icon/maskable.png
  android: true
  ios: false
  web: false

# App launcher icon (from the web PWA icon). Regenerate: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#4F46E5"
  adaptive_icon_foreground: "assets/icon/maskable.png"
