name: nostragoalus_parity
description: >-
  Cross-stack parity runner. Replays the golden vectors frozen by the TS side
  (shared/parity-json/*.json) against Dart reimplementations of the pure,
  security-critical logic, so a Flutter client cannot silently diverge from the
  web app. See README.md.
publish_to: none
environment:
  sdk: ^3.5.0

dependencies:
  # SHA-256 for the commit-reveal ledger and the key-transparency log.
  crypto: ^3.0.0

dev_dependencies:
  test: ^1.25.0
  # e2ee interop (test/e2ee_interop_test.dart) needs libsodium's exact primitives
  # (secretbox, sealed box, Argon2id, blake2b). `sodium` is the ffi binding to the
  # system libsodium (in the Flutter app it's sodium_libs). The pure modules
  # (commitment/kt/match) still run with zero native deps via parity_test.dart.
  sodium: ^3.4.4
