# Flutter/Dart toolchain for the mobile app (app/) + the parity runner (parity/).
# `mise install` here provisions them. The pure-Dart parity tests (`dart test`)
# and Android builds run on any OS; iOS builds need macOS + Xcode.
[tools]
dart = "3.12.2"
flutter = "3.44.6"   # building the app (app/); dart alone runs the parity + e2ee tests.

[tasks.parity]
description = "Replay the cross-stack golden vectors (pure Dart)"
dir = "{{ config_root }}/parity"
run = "dart test"

[tasks.e2ee-interop]
description = "E2EE interop KATs against the frozen vectors (needs libsodium)"
dir = "{{ config_root }}/parity"
run = "dart test test/e2ee_interop_test.dart"

[tasks.gen-models]
description = "Regenerate lib/api/models.gen.dart from the OpenAPI snapshot (pure Dart)"
dir = "{{ config_root }}/app"
run = "bash tool/gen_models.sh"

[tasks.models-check]
description = "Fail if lib/api/models.gen.dart is stale vs the OpenAPI snapshot"
dir = "{{ config_root }}/app"
run = "bash tool/gen_models.sh && git diff --exit-code lib/api/models.gen.dart"

[tasks.i18n-sync]
description = "Mirror shared/i18n-json into the app asset bundle"
dir = "{{ config_root }}/app"
run = "bash tool/sync_shared.sh i18n-json i18n"

[tasks.i18n-check]
description = "Fail if the bundled locales drift from shared/i18n-json"
dir = "{{ config_root }}/app"
run = "bash tool/sync_shared.sh i18n-json i18n --check"

[tasks.parity-sync]
description = "Mirror shared/parity-json KATs into the app asset bundle"
dir = "{{ config_root }}/app"
run = "bash tool/sync_shared.sh parity-json parity"

[tasks.parity-check]
description = "Fail if the bundled KATs drift from shared/parity-json"
dir = "{{ config_root }}/app"
run = "bash tool/sync_shared.sh parity-json parity --check"

[tasks.analyze]
description = "Static analysis of the Flutter app"
dir = "{{ config_root }}/app"
run = "flutter analyze"

[tasks.app-test]
description = "Flutter unit + widget tests (app/)"
dir = "{{ config_root }}/app"
run = "flutter test"

[tasks.coverage]
description = "Unit + widget tests with line coverage, checked against the floor in tool/coverage_check.sh"
dir = "{{ config_root }}/app"
run = ["flutter test --coverage", "bash tool/coverage_check.sh"]

[tasks.em-dash-check]
description = "Fail if the em-dash character appears in the locale sources or anywhere under apps/mobile-flutter"
dir = "{{ config_root }}/app"
run = "bash tool/no_em_dash.sh"

# The mobile gate, run by hand the way the web gate runs via pnpm (this repo has
# no hosted CI). Fails on a stale model/i18n/KAT mirror, an analyzer issue, a red
# unit/widget test, a cross-stack parity regression - e.g. the injector-only-
# touched-shared/i18n drift that renders keys as literals on device - or a broken
# Android build (manifest merger, minSdk/NDK, plugin registration). Steps run
# SEQUENTIALLY (a `depends` fan-out races `flutter analyze` against `flutter
# test` and the test harness dies with "Cannot close sink while adding stream").
[tasks.gate]
description = "Mobile gate: stale-checks + analyze + app tests + cross-stack parity + debug APK. Needs a system libsodium (the e2ee interop KATs dlopen it) and an Android SDK."
dir = "{{ config_root }}"
run = [
  "cd app && bash tool/gen_models.sh && git diff --exit-code lib/api/models.gen.dart",
  "cd app && bash tool/sync_shared.sh i18n-json i18n --check",
  "cd app && bash tool/sync_shared.sh parity-json parity --check",
  "cd app && bash tool/no_em_dash.sh",
  "cd app && flutter analyze",
  "cd app && flutter test --coverage && bash tool/coverage_check.sh",
  "cd parity && dart test",
  "cd app && flutter build apk --debug",
]

# Not in the gate: every spec left here needs a connected device/emulator AND a
# live server (a probe account's credentials). The device-independent crypto that
# used to live here now runs in the gate as app/test/e2ee/roundtrip_test.dart;
# what remains is the on-device native-libsodium KAT replay and the three
# server-backed flows. Run it before a release - see README.md.
[tasks.integration]
description = "On-device integration tests (needs a connected device/emulator: flutter devices)"
dir = "{{ config_root }}/app"
run = "flutter test integration_test"

[tasks.e2e-seed]
description = "Seed the isolated e2e stack (mise run e2e-up, from the repo root) with the probe account, fixture and league the mobile e2e needs"
dir = "{{ config_root }}/../.."
run = "bash apps/mobile-flutter/app/tool/seed_e2e.sh"

# Needs a device/emulator AND a seeded server. The full ritual, from the repo root:
#   mise run e2e-up                        # isolated stack, app on :3100
#   mise -C apps/mobile-flutter run e2e-seed
#   mise -C apps/mobile-flutter run e2e
# API_BASE points at 10.0.2.2, the emulator's alias for the host loopback.
[tasks.e2e]
description = "The main-path UI end-to-end spec on a device/emulator against a live, seeded server (run e2e-up + e2e-seed first)"
dir = "{{ config_root }}/app"
run = """
flutter test integration_test/main_path_test.dart \
  --dart-define=API_BASE=${NG_E2E_API_BASE:-http://10.0.2.2:3100} \
  --dart-define=PROBE_EMAIL=${PROBE_EMAIL:-probe@example.com} \
  --dart-define=PROBE_PASSWORD=${PROBE_PASSWORD:-Probe-Password123!}
"""

[tasks.apk-publish]
description = "Build the release APK and publish it for the website to serve (apps/web-nuxt/downloads -> /download/nostragoalus.apk)"
dir = "{{ config_root }}/app"
run = """
set -euo pipefail
# AppConfig.apiBase is a compile-time String.fromEnvironment whose default is the
# emulator's host alias, so a build without this define is unroutable from a real
# phone - it reaches nothing and the sign-in screen blames the password. That
# shipped once (v4.7.0); the guards below are why it cannot ship again.
api_base="${NG_APP_API_BASE:-https://goal.arzaroth.com}"
web_base="${NG_APP_WEB_BASE:-$api_base}"
# Both bases ride in the APK, so both get checked. A published build has to be
# reachable from a stranger's phone: https, and a routable host - not a loopback
# and not a private LAN address, which is the shape a dev override leaves behind.
for pair in "API_BASE=$api_base" "WEB_BASE=$web_base"; do
  name="${pair%%=*}"; value="${pair#*=}"
  case "$value" in
    https://*) ;;
    *) echo "apk-publish: $name must be an https origin, got '$value'" >&2; exit 1 ;;
  esac
  host="${value#https://}"; host="${host%%/*}"; host="${host%%:*}"
  case "$host" in
    localhost|*.localhost|*.local|127.*|10.*|0.0.0.0|169.254.*|192.168.*|host.docker.internal)
      echo "apk-publish: $name host '$host' is not routable from a phone" >&2; exit 1 ;;
    172.1[6-9].*|172.2[0-9].*|172.3[01].*)
      echo "apk-publish: $name host '$host' is not routable from a phone" >&2; exit 1 ;;
  esac
done
# A release keystore has to be configured, because build.gradle.kts falls back to
# the DEBUG key when it is not - and that key ships with every Android SDK, so a
# debug-signed publish both fails App Links verification (assetlinks.json carries
# the release fingerprint) and lets anyone sign an in-place upgrade over the real
# app. Silent fallback is fine for `flutter run --release`, never for publishing.
if [ ! -f android/key.properties ] && [ -z "${NG_ANDROID_KEYSTORE:-}" ]; then
  echo "apk-publish: no release keystore (android/key.properties or NG_ANDROID_KEYSTORE)" >&2
  exit 1
fi
out="{{ config_root }}/../web-nuxt/downloads"
mkdir -p "$out"
# The site shows the release version, not the pubspec's own (vestigial) one, so
# the APK on /about reads as the same release as the site serving it.
version=$(sed -n 's/.*"version": "\\([^"]*\\)".*/\\1/p' "{{ config_root }}/../web-nuxt/package.json" | head -1)
# versionName/versionCode come from the release too, so the APK's own metadata
# agrees with what the site advertises. Android orders builds by versionCode
# only, so x.y.z maps to x*10000 + y*100 + z (minor and patch stay under 100).
# sed exits 0 on no match, so an unparsed version would otherwise ship as
# versionCode 0 - which no already-installed build can ever be upgraded from.
case "$version" in
  *[!0-9.]*|*..*|.*|*.) echo "apk-publish: '$version' is not a plain x.y.z release" >&2; exit 1 ;;
esac
code=$(echo "$version" | awk -F. 'NF != 3 || $2 > 99 || $3 > 99 { exit 1 } { printf "%d", $1*10000 + $2*100 + $3 }') || {
  echo "apk-publish: '$version' does not fit the versionCode scheme (x.y.z, minor/patch < 100)" >&2
  exit 1
}
flutter build apk --release --dart-define=API_BASE="$api_base" --dart-define=WEB_BASE="$web_base" --build-name="$version" --build-number="$code"
printf '{"version":"%s","builtAt":"%s"}\\n' "$version" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$out/nostragoalus.apk.json"
# Stage then rename: the server stats and hashes the APK before streaming it, so
# copying over the live file in place would serve one build's bytes under another
# build's length and digest. A rename within the directory is atomic, and a
# download already in flight keeps reading the old inode.
cp build/app/outputs/flutter-apk/app-release.apk "$out/.nostragoalus.apk.new"
mv -f "$out/.nostragoalus.apk.new" "$out/nostragoalus.apk"
sha256sum "$out/nostragoalus.apk"
"""
