# Flutter/Dart toolchain for the mobile app (app/) + the parity runner (parity/).
# `mise install` here provisions them. The pure-Dart parity tests (`dart test`)
# and Android builds run on any OS; iOS builds need macOS + Xcode.
[tools]
dart = "3.12.2"
flutter = "3.44.6"   # building the app (app/); dart alone runs the parity + e2ee tests.

[tasks.parity]
description = "Replay the cross-stack golden vectors (pure Dart)"
dir = "{{ config_root }}/parity"
run = "dart test"

[tasks.e2ee-interop]
description = "E2EE interop KATs against the frozen vectors (needs libsodium)"
dir = "{{ config_root }}/parity"
run = "dart test test/e2ee_interop_test.dart"

[tasks.gen-models]
description = "Regenerate lib/api/models.gen.dart from the OpenAPI snapshot (pure Dart)"
dir = "{{ config_root }}/app"
run = "bash tool/gen_models.sh"

[tasks.models-check]
description = "Fail if lib/api/models.gen.dart is stale vs the OpenAPI snapshot"
dir = "{{ config_root }}/app"
run = "bash tool/gen_models.sh && git diff --exit-code lib/api/models.gen.dart"

[tasks.i18n-sync]
description = "Mirror shared/i18n-json into the app asset bundle"
dir = "{{ config_root }}/app"
run = "bash tool/sync_shared.sh i18n-json i18n"

[tasks.i18n-check]
description = "Fail if the bundled locales drift from shared/i18n-json"
dir = "{{ config_root }}/app"
run = "bash tool/sync_shared.sh i18n-json i18n --check"

[tasks.parity-sync]
description = "Mirror shared/parity-json KATs into the app asset bundle"
dir = "{{ config_root }}/app"
run = "bash tool/sync_shared.sh parity-json parity"

[tasks.parity-check]
description = "Fail if the bundled KATs drift from shared/parity-json"
dir = "{{ config_root }}/app"
run = "bash tool/sync_shared.sh parity-json parity --check"

[tasks.analyze]
description = "Static analysis of the Flutter app"
dir = "{{ config_root }}/app"
run = "flutter analyze"

[tasks.app-test]
description = "Flutter unit + widget tests (app/)"
dir = "{{ config_root }}/app"
run = "flutter test"

[tasks.coverage]
description = "Unit + widget tests with line coverage, checked against the floor in tool/coverage_check.sh"
dir = "{{ config_root }}/app"
run = ["flutter test --coverage", "bash tool/coverage_check.sh"]

[tasks.em-dash-check]
description = "Fail if the em-dash character appears in the locale sources or anywhere under apps/mobile-flutter"
dir = "{{ config_root }}/app"
run = "bash tool/no_em_dash.sh"

# The mobile gate, run by hand the way the web gate runs via pnpm (this repo has
# no hosted CI). Fails on a stale model/i18n/KAT mirror, an analyzer issue, a red
# unit/widget test, a cross-stack parity regression - e.g. the injector-only-
# touched-shared/i18n drift that renders keys as literals on device - or a broken
# Android build (manifest merger, minSdk/NDK, plugin registration). Steps run
# SEQUENTIALLY (a `depends` fan-out races `flutter analyze` against `flutter
# test` and the test harness dies with "Cannot close sink while adding stream").
[tasks.gate]
description = "Mobile gate: stale-checks + analyze + app tests + cross-stack parity + debug APK. Needs a system libsodium (the e2ee interop KATs dlopen it) and an Android SDK."
dir = "{{ config_root }}"
run = [
  "cd app && bash tool/gen_models.sh && git diff --exit-code lib/api/models.gen.dart",
  "cd app && bash tool/sync_shared.sh i18n-json i18n --check",
  "cd app && bash tool/sync_shared.sh parity-json parity --check",
  "cd app && bash tool/no_em_dash.sh",
  "cd app && flutter analyze",
  "cd app && flutter test --coverage && bash tool/coverage_check.sh",
  "cd parity && dart test",
  "cd app && flutter build apk --debug",
]

# Not in the gate: every spec left here needs a connected device/emulator AND a
# live server (a probe account's credentials). The device-independent crypto that
# used to live here now runs in the gate as app/test/e2ee/roundtrip_test.dart;
# what remains is the on-device native-libsodium KAT replay and the three
# server-backed flows. Run it before a release - see README.md.
[tasks.integration]
description = "On-device integration tests (needs a connected device/emulator: flutter devices)"
dir = "{{ config_root }}/app"
run = "flutter test integration_test"

[tasks.e2e-seed]
description = "Seed the isolated e2e stack (mise run e2e-up, from the repo root) with the probe account, fixture and league the mobile e2e needs"
dir = "{{ config_root }}/../.."
run = "bash apps/mobile-flutter/app/tool/seed_e2e.sh"

# Needs a device/emulator AND a seeded server. The full ritual, from the repo root:
#   mise run e2e-up                        # isolated stack, app on :3100
#   mise -C apps/mobile-flutter run e2e-seed
#   mise -C apps/mobile-flutter run e2e
# API_BASE points at 10.0.2.2, the emulator's alias for the host loopback.
[tasks.e2e]
description = "The main-path UI end-to-end spec on a device/emulator against a live, seeded server (run e2e-up + e2e-seed first)"
dir = "{{ config_root }}/app"
run = """
flutter test integration_test/main_path_test.dart \
  --dart-define=API_BASE=${NG_E2E_API_BASE:-http://10.0.2.2:3100} \
  --dart-define=PROBE_EMAIL=${PROBE_EMAIL:-probe@example.com} \
  --dart-define=PROBE_PASSWORD=${PROBE_PASSWORD:-Probe-Password123!}
"""

[tasks.apk-publish]
description = "Build the release APK, publish it to the R2 bucket, and write the sidecar the website reads (apps/web-nuxt/downloads)"
dir = "{{ config_root }}/app"
run = """
set -euo pipefail
# AppConfig.apiBase is a compile-time String.fromEnvironment whose default is the
# emulator's host alias, so a build without this define is unroutable from a real
# phone - it reaches nothing and the sign-in screen blames the password. That
# shipped once (v4.7.0); the guards below are why it cannot ship again.
api_base="${NG_APP_API_BASE:-https://goal.arzaroth.com}"
web_base="${NG_APP_WEB_BASE:-$api_base}"
# rclone remote and the public custom domain in front of it. `rclone config`
# holds the credentials; nothing here reads them and nothing here prints them.
R2="${NG_R2_REMOTE:-r2-nostragoalus:nostragoalus}"
R2_BASE="${NG_R2_BASE:-https://r2.goal.arzaroth.com}"
# Checked like API_BASE/WEB_BASE above, and for the same reason: this value ends
# up in the sidecar's url, which the server accepts only over https and only for
# ANDROID_BUCKET_HOST. A wrong one here publishes successfully and then reads as
# "no build published" on the site, with nothing logged anywhere.
case "$R2_BASE" in
  https://*) ;;
  *) echo "apk-publish: NG_R2_BASE must be an https origin, got '$R2_BASE'" >&2; exit 1 ;;
esac
R2_BASE="${R2_BASE%/}"
command -v rclone >/dev/null || { echo "apk-publish: no rclone. It publishes the APK." >&2; exit 1; }
# Both bases ride in the APK, so both get checked. A published build has to be
# reachable from a stranger's phone: https, and a routable host - not a loopback
# and not a private LAN address, which is the shape a dev override leaves behind.
for pair in "API_BASE=$api_base" "WEB_BASE=$web_base"; do
  name="${pair%%=*}"; value="${pair#*=}"
  case "$value" in
    https://*) ;;
    *) echo "apk-publish: $name must be an https origin, got '$value'" >&2; exit 1 ;;
  esac
  host="${value#https://}"; host="${host%%/*}"; host="${host%%:*}"
  case "$host" in
    localhost|*.localhost|*.local|127.*|10.*|0.0.0.0|169.254.*|192.168.*|host.docker.internal)
      echo "apk-publish: $name host '$host' is not routable from a phone" >&2; exit 1 ;;
    172.1[6-9].*|172.2[0-9].*|172.3[01].*)
      echo "apk-publish: $name host '$host' is not routable from a phone" >&2; exit 1 ;;
  esac
done
# A release keystore has to be configured, because build.gradle.kts falls back to
# the DEBUG key when it is not - and that key ships with every Android SDK, so a
# debug-signed publish both fails App Links verification (assetlinks.json carries
# the release fingerprint) and lets anyone sign an in-place upgrade over the real
# app. Silent fallback is fine for `flutter run --release`, never for publishing.
if [ ! -f android/key.properties ] && [ -z "${NG_ANDROID_KEYSTORE:-}" ]; then
  echo "apk-publish: no release keystore (android/key.properties or NG_ANDROID_KEYSTORE)" >&2
  exit 1
fi
out="{{ config_root }}/../web-nuxt/downloads"
mkdir -p "$out"
# The app's own version, from its own pubspec - NOT the website's. The two ship
# on separate lines: a site-only release should not mint an APK, and an app-only
# release should not need one. `name+code`, the Flutter convention.
pubspec="{{ config_root }}/app/pubspec.yaml"
version=$(sed -n 's/^version: *\\([0-9.]*\\)+.*/\\1/p' "$pubspec" | head -1)
code=$(sed -n 's/^version: *[0-9.]*+\\([0-9]*\\).*/\\1/p' "$pubspec" | head -1)
# sed exits 0 on no match, so an unparsed line would otherwise ship as an empty
# name and versionCode 0 - which no already-installed build can upgrade from.
case "$version" in
  ''|*[!0-9.]*|*..*|.*|*.) echo "apk-publish: pubspec version '$version' is not a plain x.y.z" >&2; exit 1 ;;
esac
case "$code" in
  ''|*[!0-9]*) echo "apk-publish: pubspec build number '$code' is not an integer" >&2; exit 1 ;;
esac
echo "apk-publish: app $version (versionCode $code)" 
flutter build apk --release --dart-define=API_BASE="$api_base" --dart-define=WEB_BASE="$web_base" --dart-define=APP_VERSION="$version" --build-name="$version" --build-number="$code"
apk=build/app/outputs/flutter-apk/app-release.apk
name="nostragoalus-$version.apk"
sum=$(sha256sum "$apk" | cut -d' ' -f1)
size=$(stat -c%s "$apk")
built=$(date -u +%Y-%m-%dT%H:%M:%SZ)

# The bytes go to the bucket, not to the web host. Serving ~90 MB per download
# out of the app process was the whole problem; R2 has no origin to exhaust and
# charges nothing for egress. The host only ever gets the sidecar below, a few
# hundred bytes, which is what tells it the build exists and where it lives.
#
# Uploaded to a dot-prefixed name and moved into place, so a half-copied file is
# never reachable at the real URL. Nothing is published without the digest being
# read back over HTTPS from the URL people will actually use - through the cache,
# as a stranger would - because that is the promise the download page makes.
echo "== $apk -> $R2/apk/$name"
echo "   sha256 $sum  ($size bytes)"
rclone copyto "$apk" "$R2/apk/.$name.part" \
  --header-upload "Content-Type: application/vnd.android.package-archive" \
  --header-upload "Cache-Control: public, max-age=31536000, immutable" </dev/null
remote_size=$(rclone lsf --format s "$R2/apk/.$name.part" </dev/null | head -1)
if [ "$size" != "$remote_size" ]; then
  rclone deletefile "$R2/apk/.$name.part" </dev/null || true
  echo "apk-publish: upload is $remote_size bytes, expected $size. Nothing published." >&2
  exit 1
fi
rclone moveto "$R2/apk/.$name.part" "$R2/apk/$name" </dev/null

# Verified at the PLAIN url, the one people get - not a cache-busted variant.
# A busted probe proves only that the bucket holds the right bytes, which is the
# question nobody is asking: an edge that already holds an older object (a
# re-publish at the same version overwrites an object sent `immutable`) would
# keep serving it, and a probe that dodges the cache cannot see that. The headers
# are checked too, because `moveto` is a server-side copy and whether it carries
# the metadata set on the upload is a backend detail, not a promise.
verify() {
  local url="$1" hdr got
  hdr=$(curl -fsSI --max-time 120 "$url" </dev/null) || return 1
  printf '%s' "$hdr" | grep -qi 'cache-control:[[:space:]]*public, max-age=31536000, immutable' || {
    echo "   no immutable cache-control on the published object" >&2; return 1; }
  printf '%s' "$hdr" | grep -qi 'content-type:[[:space:]]*application/vnd.android.package-archive' || {
    echo "   wrong content-type on the published object" >&2; return 1; }
  got=$(curl -fsSL --max-time 900 "$url" </dev/null | sha256sum | cut -d' ' -f1) || return 1
  [ "$got" = "$sum" ] || { echo "   serves $got, not $sum" >&2; return 1; }
}

ok=
for attempt in 1 2 3; do
  if verify "$R2_BASE/apk/$name"; then ok=1; break; fi
  echo "   attempt $attempt did not check out, retrying" >&2
  sleep 5
done
if [ -z "$ok" ]; then
  echo "apk-publish: $R2_BASE/apk/$name is not serving this build. If it is a" >&2
  echo "  re-publish of a version already released, an edge is still holding the" >&2
  echo "  old object (it was sent immutable) and the cache key needs purging." >&2
  rclone deletefile "$R2/apk/.$name.part" </dev/null 2>/dev/null || true
  exit 1
fi
echo "   published and verified $R2_BASE/apk/$name"

# The host's own copy goes FIRST. The server prefers a sidecar naming a bucket
# object, so a leftover here is no longer served - but leaving ~90 MB behind on
# every publish is how the directory silently stops matching what it describes.
rm -f "$out/nostragoalus.apk"
# Staged and renamed, because this file IS the publication record: a reader
# landing mid-write would see truncated JSON and report no build at all. A rename
# within the directory is atomic.
printf '{"version":"%s","builtAt":"%s","sizeBytes":%s,"sha256":"%s","url":"%s"}\\n' \
  "$version" "$built" "$size" "$sum" "$R2_BASE/apk/$name" > "$out/.nostragoalus.apk.json.new"
mv -f "$out/.nostragoalus.apk.json.new" "$out/nostragoalus.apk.json"
echo "== sidecar -> $out/nostragoalus.apk.json"
cat "$out/nostragoalus.apk.json"
echo "== copy ONLY that sidecar to the host; the APK belongs in the bucket now."
"""
