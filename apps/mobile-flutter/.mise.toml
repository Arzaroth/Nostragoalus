# Flutter/Dart toolchain for the mobile app (app/) + the parity runner (parity/).
# `mise install` here provisions them. The pure-Dart parity tests (`dart test`)
# and Android builds run on any OS; iOS builds need macOS + Xcode.
[tools]
dart = "3.12.2"
flutter = "3.44.6"   # building the app (app/); dart alone runs the parity + e2ee tests.

[tasks.parity]
description = "Replay the cross-stack golden vectors (pure Dart)"
dir = "{{ config_root }}/parity"
run = "dart test"

[tasks.e2ee-interop]
description = "E2EE interop KATs against the frozen vectors (needs libsodium)"
dir = "{{ config_root }}/parity"
run = "dart test test/e2ee_interop_test.dart"

[tasks.gen-models]
description = "Regenerate lib/api/models.gen.dart from the OpenAPI snapshot (pure Dart)"
dir = "{{ config_root }}/app"
run = "bash tool/gen_models.sh"

[tasks.models-check]
description = "Fail if lib/api/models.gen.dart is stale vs the OpenAPI snapshot"
dir = "{{ config_root }}/app"
run = "bash tool/gen_models.sh && git diff --exit-code lib/api/models.gen.dart"
